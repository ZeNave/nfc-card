<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'">
<title>Emergency Info</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; line-height: 1.4; }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 1.1rem; letter-spacing: .08em; color: #b00020; margin: 0 0 12px; }
  h2 { font-size: .85rem; text-transform: uppercase; letter-spacing: .06em; opacity: .7; margin: 20px 0 6px; }
  .row { display: flex; gap: 12px; padding: 8px 0; border-bottom: 1px solid rgba(128,128,128,.3); }
  .label { flex: 0 0 38%; opacity: .7; }
  .value { flex: 1; font-weight: 600; word-break: break-word; }
  .alert .value { color: #b00020; }
  a.call { display: inline-block; margin-top: 4px; padding: 8px 14px; border-radius: 8px;
           background: #b00020; color: #fff; text-decoration: none; font-weight: 600; }
  .foot { margin-top: 28px; font-size: .75rem; opacity: .6; }
</style>
</head>
<body>
<main id="app"><p>Loading…</p></main>

<script>
(async () => {
  const app = document.getElementById('app');

  // Field keys on the card are short to save bytes.
  const SECTIONS = [
    ['Person',        [['n','Name'], ['b','Date of birth'], ['s','Sex']]],
    ['Medical',       [['bt','Blood type'], ['al','Allergies', true], ['md','Medications', true],
                       ['cd','Conditions'], ['nt','Notes']]],
    ['Car insurance', [['ins','Insurer'], ['pol','Policy no.'], ['pl','Plate']]],
  ];

  function b64urlToBytes(s) {
    s = s.replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    return Uint8Array.from(atob(s), c => c.charCodeAt(0));
  }

  async function inflateRaw(bytes) {
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  // Everything is written with textContent, never innerHTML: anyone can craft a link,
  // so the data must be treated as untrusted text.
  function el(tag, cls, text) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function row(label, value, alert) {
    const r = el('div', 'row' + (alert ? ' alert' : ''));
    r.append(el('span', 'label', label), el('span', 'value', String(value)));
    return r;
  }

  function render(data) {
    app.replaceChildren(el('h1', null, 'EMERGENCY INFORMATION'));

    for (const [title, fields] of SECTIONS) {
      const rows = fields
        .filter(([k]) => data[k] !== undefined && data[k] !== '')
        .map(([k, label, alert]) => row(label, data[k], alert));
      if (!rows.length) continue;
      app.append(el('h2', null, title), ...rows);
    }

    if (Array.isArray(data.ice) && data.ice.length) {
      app.append(el('h2', null, 'Emergency contacts'));
      for (const c of data.ice) {
        const r = el('div', 'row');
        r.append(el('span', 'label', c.r ? String(c.r) : 'Contact'));
        const v = el('span', 'value', c.n ? String(c.n) : '');
        if (c.p) {
          v.append(document.createElement('br'));
          const a = el('a', 'call', String(c.p));
          a.href = 'tel:' + String(c.p).replace(/[^\d+]/g, '');   // digits and + only
          v.append(a);
        }
        r.append(v);
        app.append(r);
      }
    }

    app.append(el('p', 'foot',
      'Read directly from the card. Nothing is sent to a server or saved on this phone.'));
  }

  try {
    const raw = location.hash.slice(1);
    // Remove the data from the address bar straight away (it is already in `raw`).
    history.replaceState(null, '', location.pathname);
    if (!raw) throw new Error('empty');

    // First character = format: z = deflate-raw compressed JSON, j = plain JSON.
    const mode = raw[0];
    const bytes = b64urlToBytes(raw.slice(1));
    let json;
    if (mode === 'z') json = await inflateRaw(bytes);
    else if (mode === 'j') json = bytes;
    else throw new Error('unknown format');

    render(JSON.parse(new TextDecoder().decode(json)));
  } catch (e) {
    app.replaceChildren(
      el('h1', null, 'EMERGENCY INFORMATION'),
      el('p', null, 'No readable data in this link. If the card has a plain-text record, read that instead.'));
  }
})();
</script>
</body>
</html>
